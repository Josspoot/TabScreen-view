<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#000000">
  <title>TabScreen</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <video id="video" class="screen" muted playsinline autoplay disablepictureinpicture></video>
  <canvas id="canvas" class="screen" hidden></canvas>

  <div id="overlay">
    <div class="card">
      <h1>TabScreen</h1>
      <p id="status">Conectando…</p>

      <div id="pair" hidden>
        <p class="label">Código de verificación</p>
        <div id="pair-code" class="code"></div>
        <p class="hint">Escríbelo en la ventana que apareció en la Mac para permitir la conexión.</p>
      </div>

      <div id="controls" hidden>
        <button id="start">Pantalla completa</button>
        <p class="label">¿Dónde está esta pantalla respecto a tu Mac?</p>
        <div class="positions">
          <button class="secondary" data-side="left">← Izquierda</button>
          <button class="secondary" data-side="right">Derecha →</button>
          <button class="secondary" data-side="above">↑ Arriba</button>
          <button class="secondary" data-side="below">↓ Abajo</button>
        </div>
        <label class="hint"><input type="checkbox" id="show-stats"> Mostrar estadísticas</label>
        <p class="hint">Toca fuera de este panel para cerrarlo; toca dos veces la pantalla para volver a abrirlo.</p>
      </div>

      <p id="device" class="hint"></p>
    </div>
  </div>

  <div id="stats" hidden></div>

  <script src="fmp4.js"></script>
  <script src="players.js"></script>
  <script src="app.js"></script>
</body>
</html>
